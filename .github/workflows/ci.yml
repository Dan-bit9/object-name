name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/object-name
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to self-hosted runner
    needs: docker
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/object-name:latest
      CONTAINER: object-name
      PORT: 8000
    steps:
      - name: Check out monitoring scripts
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull, deploy, and monitor in one runner step
        shell: powershell
        run: |
          $root = (Get-Location).Path
          $logDir = Join-Path $root 'deployment-logs'
          Remove-Item -LiteralPath $logDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $root 'monitor.stop') -Force -ErrorAction SilentlyContinue
          docker pull $env:IMAGE
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $monitor = Start-Job -Name DeploymentMonitor -FilePath (Join-Path $root 'scripts/monitor.ps1') `
            -ArgumentList $logDir,(Join-Path $root 'monitor.stop'),30
          Start-Sleep -Seconds 3
          if ($monitor.State -eq 'Failed') { Receive-Job $monitor; throw 'Monitor failed before deployment started' }

          $network = "$env:CONTAINER-net"
          $proxy = "$env:CONTAINER-proxy"
          $backend = "$env:CONTAINER-backend"
          $new = "$env:CONTAINER-next"
          $config = Join-Path $root 'deployment-nginx.conf'
          docker network create $network 2>$null
          docker rm -f $new 2>$null
          New-Item -ItemType File -Path (Join-Path $logDir 'during.marker') -Force | Out-Null
          docker run -d --name $new --network $network --restart unless-stopped $env:IMAGE

          $healthy = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $status = docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' $new 2>$null
            if ($status -eq 'healthy') { $healthy = $true; break }
            if ($status -eq 'unhealthy' -or $status -eq 'exited') { break }
          }
          if (-not $healthy) {
            docker logs $new
            docker rm -f $new
            throw "New container did not become healthy. Last status: $status"
          }
          $oldProxy = docker ps -aq --filter "name=^/${proxy}$"
          $oldBackend = docker ps -aq --filter "name=^/${backend}$"
          if (-not $oldProxy) {
            # One-time migration from the old direct-port container. Future
            # releases switch only the proxy upstream while the old backend
            # remains available, avoiding the old remove-then-run gap.
            docker rm -f $env:CONTAINER 2>$null
            docker rename $new $backend
            $new = $backend
            "events { worker_connections 128; }`nhttp { upstream app_backend { server ${backend}:8000; } server { listen 80; location / { proxy_pass http://app_backend; } } }" | Set-Content $config -Encoding utf8
            docker run -d --name $proxy --network $network -p "${env:PORT}:80" -v "${config}:/etc/nginx/conf.d/default.conf:ro" --restart unless-stopped nginx:alpine
          } else {
            "events { worker_connections 128; }`nhttp { upstream app_backend { server ${new}:8000; } server { listen 80; location / { proxy_pass http://app_backend; } } }" | Set-Content $config -Encoding utf8
            docker exec $proxy nginx -s reload
            docker rm -f $backend 2>$null
            docker rename $new $backend
          }
          $proxyHealthy = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            try {
              $health = Invoke-RestMethod "http://127.0.0.1:$env:PORT/api/health" -TimeoutSec 5
              if ($health.ok -eq $true -and $health.model_version -eq 'resnet18-full-frame-v2') { $proxyHealthy = $true; break }
            } catch { }
          }
          if (-not $proxyHealthy) { docker logs $proxy 2>$null; throw 'Proxy did not expose the v2 backend on port 8000' }
          docker ps --filter "name=$proxy" --filter "name=$backend" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          New-Item -ItemType File -Path (Join-Path $logDir 'after.marker') -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $root 'monitor.stop') -Force | Out-Null
          Wait-Job -Job $monitor -Timeout 45 | Out-Null
          Receive-Job -Job $monitor -Keep -ErrorAction SilentlyContinue
          Remove-Job -Job $monitor -Force -ErrorAction SilentlyContinue

      - name: Publish deployment summary
        if: always()
        shell: powershell
        run: |
          if (Test-Path deployment-logs/summary.md) { Get-Content deployment-logs/summary.md -Encoding utf8 | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          else { "# Deployment verification summary`n`nMonitor did not produce a summary; inspect the artifact logs." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification-logs
          path: deployment-logs
          if-no-files-found: warn
