<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쑥쑥 사물 학습</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><div class="logo">🌱</div><div><h1>쑥쑥 사물 학습</h1><p>사진으로 배우고, 재미있게 맞혀봐요!</p></div></header>
<div class="tabs"><button class="tab active" data-mode="identify">이름 알려주기</button><button class="tab" data-mode="quiz">맞히기</button></div>
<section class="card"><div id="quizOptions" class="quiz-options hidden"><label>어떤 물건을 찾아볼까요?</label><select id="target"></select></div>
<label class="drop" for="file"><span class="camera">📷</span><strong>사진을 선택하거나 촬영해 주세요</strong><small>JPG, PNG · 카메라 사용 가능</small></label><input id="file" type="file" accept="image/*" capture="environment"><img id="preview" class="preview hidden" alt="선택한 사진">
<button id="run" class="primary" disabled>이 사진으로 알아보기</button><div id="result" class="result"><span class="result-icon">✨</span><h2>사진을 올리면 결과가 여기에 보여요</h2><p>카메라 또는 갤러리에서 사진을 선택해 주세요.</p></div><button id="speak" class="speak hidden">🔊 다시 들려주세요</button></section>
<p class="notice">⚠️ 인공지능의 답은 틀릴 수 있어요. 잘 모르겠어요라고 나오면 더 선명한 사진으로 다시 시도해 보세요.</p></main><script src="/static/app.js"></script></body></html>
